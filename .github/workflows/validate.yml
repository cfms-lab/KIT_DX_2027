name: Validate curriculum dataset

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install python-docx
      - run: python scripts/build_curriculum_dataset.py
      - run: python scripts/verify_dataset.py
      - name: Confirm generated text data is current
        run: git diff --exit-code -- data/*.csv graph_corpus
